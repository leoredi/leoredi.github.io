# Research Interests / Topics
# Configure with your research areas
topics:
  - name: Machine Learning
    web_url: https://github.com/topics/machine-learning
    image_url: https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/machine-learning/machine-learning.png

  - name: Artificial Intelligence
    web_url: https://github.com/topics/artificial-intelligence
    image_url: https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/artificial-intelligence/artificial-intelligence.png

  - name: Data Science
    web_url: https://github.com/topics/data-science
    image_url: https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/data-science/data-science.png
